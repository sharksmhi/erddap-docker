---
- name: Install packages needed for Docker repo
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Dearmor Docker GPG key
  ansible.builtin.command:
    cmd: "gpg --dearmor -o /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc"
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Check if Docker GPG keyring exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.gpg
  register: docker_gpg_stat

- name: Verify Docker GPG key fingerprint
  ansible.builtin.command:
    cmd: "gpg --show-keys --with-fingerprint /etc/apt/keyrings/docker.gpg"
  register: docker_gpg_info
  changed_when: false
  failed_when: docker_gpg_info.rc != 0
  when: docker_gpg_stat.stat.exists
  check_mode: false

- name: Assert Docker GPG fingerprint is correct
  ansible.builtin.assert:
    that:
      - "(docker_gpg_info.stdout | default('') | regex_replace('\\s+', '')) is search(docker_gpg_fingerprint_tail)"
    fail_msg: "Docker GPG key fingerprint check failed or fingerprint output missing."
  when: docker_gpg_stat.stat.exists
  check_mode: false

- name: Set Docker repo facts
  ansible.builtin.set_fact:
    docker_codename: "{{ ansible_facts.distribution_release }}"
    docker_arch: >-
      {{
        'amd64' if ansible_facts.architecture in ['x86_64', 'amd64']
        else 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64']
        else ansible_facts.architecture
      }}

- name: Configure Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
    content: |
      deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.gpg] {{ docker_repo_url }} {{ docker_codename }} stable

- name: Install Docker Engine and compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
