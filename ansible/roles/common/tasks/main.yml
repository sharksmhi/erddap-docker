---
- name: Ensure erddap-data group exists
  ansible.builtin.group:
    name: erddap-data
    state: present
  tags: [adduser]

- name: Check docker group exists
  ansible.builtin.getent:
    database: group
    key: docker
  register: docker_group
  failed_when: false
  changed_when: false
  tags: [adduser, never]

- name: Require setup before add-user if docker group missing
  ansible.builtin.fail:
    msg: "Docker group is missing. Run ./manage.sh setup first."
  when: docker_group is failed
  tags: [adduser, never]

- name: Ensure admin user exists
  ansible.builtin.user:
    name: "{{ admin_username }}"
    groups: "{{ admin_extra_groups | join(',') }}"
    append: true
    create_home: true
    shell: /bin/bash
    state: present

- name: Ensure user exists
  ansible.builtin.user:
    name: "{{ new_user }}"
    groups: "{{ user_groups | join(',') }}"
    append: true
    create_home: true
    shell: /bin/bash
    state: present
  when: new_user | length > 0
  tags: [adduser, never]

- name: Ensure .ssh directory exists for user
  ansible.builtin.file:
    path: "/home/{{ new_user }}/.ssh"
    state: directory
    owner: "{{ new_user }}"
    group: "{{ new_user }}"
    mode: "0700"
  when: new_user | length > 0
  tags: [adduser, never]

- name: Ensure authorized_keys exists for user
  ansible.builtin.file:
    path: "/home/{{ new_user }}/.ssh/authorized_keys"
    state: file
    owner: "{{ new_user }}"
    group: "{{ new_user }}"
    mode: "0600"
  when: new_user | length > 0
  tags: [adduser, never]

- name: Configure SSH root login policy
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^(#\s*)?PermitRootLogin\s+'
    line: "PermitRootLogin {{ ssh_permit_root_login }}"
    backup: true
  notify: Restart SSH
